# Aether Plugin 依赖配置
# 此文件是版本要求的单一事实来源 (Single Source of Truth)

cli:
  min_version: "1.0.0"
  recommended_version: "1.23.1"
  # 安装位置 (与 config.yaml 同目录)
  install_dir: "~/.aether"
  install_path:
    linux: "~/.aether/aether"
    darwin: "~/.aether/aether"
    windows: "%USERPROFILE%\\.aether\\aether.exe"
  # 发布源: 主项目 Aether 的 releases
  release_api: "https://forgejo.10cg.pub/api/v1/repos/10CG/Aether/releases"
  # 获取最新版本
  latest_url: "https://forgejo.10cg.pub/api/v1/repos/10CG/Aether/releases/latest"
  # 获取指定版本 (替换 {VERSION})
  version_url: "https://forgejo.10cg.pub/api/v1/repos/10CG/Aether/releases/tags/cli-v{VERSION}"
  # Tag 格式 (主仓库实际 tag 形如 cli-v1.16.33, 非 aether-cli/v...)
  tag_format: "cli-v{VERSION}"
  # 二进制命名格式
  binary_format: "aether-{OS}-{ARCH}"  # Windows 添加 .exe
  # 源码仓库
  source_repo: "https://forgejo.10cg.pub/10CG/aether-cli.git"
  # Cloudflare Access 认证配置
  cf_access:
    # 环境变量 (优先级从高到低)
    env_vars:
      - "CF_ACCESS_TOKEN"
      - "CLOUDFLARE_ACCESS_TOKEN"
      - "CF_AUTHORIZATION"
    # 配置文件路径 (优先级从高到低)
    config_files:
      - "~/.cloudflare/access-token"
      - "~/.cfaccess"
      - "~/.config/cloudflare/access-token"
    # Cookie 名称 (用于浏览器导出)
    cookie_name: "CF_Authorization"
    # 如何获取 Token 的说明
    instructions: |
      1. 在浏览器中访问 https://forgejo.10cg.pub 并完成 CF 认证
      2. 打开开发者工具 → Application → Cookies
      3. 复制 CF_Authorization cookie 值
      4. 设置环境变量: export CF_ACCESS_TOKEN="your-token"
         或保存到文件: echo "your-token" > ~/.cfaccess
  # 支持的平台
  platforms:
    - os: linux
      arch: amd64
      binary: "aether-linux-amd64"
    - os: linux
      arch: arm64
      binary: "aether-linux-arm64"
    - os: darwin
      arch: amd64
      binary: "aether-darwin-amd64"
    - os: darwin
      arch: arm64
      binary: "aether-darwin-arm64"
    - os: windows
      arch: amd64
      binary: "aether-windows-amd64.exe"

# 版本兼容性矩阵
compatibility:
  - plugin_version: "0.8.x"
    cli_min: "0.7.0"
    cli_recommended: "0.7.0"
    notes: "故障转移支持、nomad_servers 配置"

  - plugin_version: "0.9.x"
    cli_min: "0.8.0"
    cli_recommended: "0.8.0"
    notes: "TBD"

  - plugin_version: "1.10.x"
    cli_min: "1.0.0"
    cli_recommended: "1.13.2"
    notes: "doctor heuristic refinements (Aether #47); migrate-script timestamp tightening (#48); host_volume_parity / docker_disk_pressure / docker_root_on_nfs driver-filter (Aether #67)"

  - plugin_version: "1.12.2+"
    cli_min: "1.0.0"
    cli_recommended: "1.18.0"
    notes: >-
      Aether #338: aether-rotate-pat 准入码表 8 → 9 (+DECLARED_VAR_KEY_ABSENT),
      且 PREFLIGHT_FAILED 不再只由 --dry-run 产生。两者都需 cli >= 1.18.0 (#334):
      更早版本对「declared path 上缺 declared var key」的 entry 会照常 rotate,
      把新 token 写进一个没人读的槽位并报 complete。skill 内已标注版本边界,
      故 cli_min 保持 1.0.0 不上抬。

  - plugin_version: "1.12.x"
    cli_min: "1.0.0"
    cli_recommended: "1.16.75"
    notes: >-
      Aether #275: aether-rotate-pat 新增 Tier 1 准入边界三码
      (VAR_KEY_UNSUPPORTED / ORG_LEVEL_UNSUPPORTED / NO_ROTATABLE_CONSUMERS)。
      这三码需 cli >= 1.16.74 (#281) / 1.16.75 (#287) 才会由 --dry-run 与 --confirm
      共用准入点一致给出;更早版本的 dry-run 对自定义 var_key entry 会打印假绿 5-step plan。
      skill 内已就此标注版本边界, 故 cli_min 保持 1.0.0 不上抬。

  - plugin_version: "1.12.4+"
    cli_min: "1.0.0"
    cli_recommended: "1.19.0"
    notes: >-
      Aether #366: aether-conventions §2 case C 增加自查命令 `aether conn-guard <路径>`。
      该子命令自 cli 1.19.0 起提供 (#246 降级后保留的检出能力); 更早版本执行会得
      `unknown command`。skill 内已就此标注 "aether-cli v1.19.0+", 故 cli_min 保持
      1.0.0 不上抬 —— 其余 case A/C/D/E 决策路径不依赖该命令。

  - plugin_version: "1.12.7+"
    cli_min: "1.0.0"
    cli_recommended: "1.20.4"
    notes: >-
      Aether #390/#384/#387: aether-rotate-pat 追平 pat-inventory 的第四/第五类 backend
      (forgejo-push-mirror 自 cli-v1.20.3 / github-actions-secrets 自 cli-v1.20.4)。skill
      正文已标注「台账含这两类 backend 的仓需 cli ≥ 1.20.4, 旧版整份拒载 INVENTORY_PARSE_FAILED」,
      故 cli_min 保持 1.0.0 不上抬 (版本地板是台账属性、非 skill 决策路径依赖); 但**接入了这两类
      backend 的项目** (如本仓) 实际需 cli >= 1.20.4, 见 skill 正文与 Aether #400。

  - plugin_version: "1.12.10+"
    cli_min: "1.0.0"
    cli_recommended: "1.22.14"
    notes: >-
      Aether #482: aether-rollback 标准路径改调 `aether rollback` (0.7.0 起即有), 方案 B 借用
      `aether deploy --job-file` 提交 Git 里的 spec, 镜像校验以 cli >= 1.22.14 为准 —— 更早版本
      在本机没有 docker、经 Cloudflare Access 访问 registry 时会把登录页当成镜像存在 (#480)。
      cli_min 保持 1.0.0 不上抬。aether-deploy / aether-doctor / aether-dev / aether-setup 的改动
      未过 AB 回归门, 不在本版, 四者沿用 1.12.9 的正文。

  - plugin_version: "1.12.11+"
    cli_min: "1.0.0"
    cli_recommended: "1.22.14"
    notes: >-
      Aether #496: aether-doctor 新增 Step 1.5, CLI 可用时先跑 `aether doctor --json`, 再按 check 名用
      `--check` 深入 —— `--check` 自 cli 1.10.0 起提供, 更早版本报 unknown flag;
      CLI 不可用时 skill 走原来的手工检查流程, 故 cli_min 保持 1.0.0 不上抬。aether-deploy / aether-dev / aether-setup 仍沿用 1.12.9 的正文。

  - plugin_version: "1.12.12+"
    cli_min: "1.0.0"
    cli_recommended: "1.22.14"
    notes: >-
      Aether #496: aether-deploy 改调 `aether deploy`, 镜像校验以 cli >= 1.22.14 为准 (更早版本经 CF Access
      访问 registry 时会把登录页当成镜像存在, #480), skill 的 min_version 为 1.22.14; 提交前另用 nomad CLI
      跑 `nomad job plan`。cli_min 保持 1.0.0 不上抬 (其余 skill 不依赖)。aether-dev / aether-setup 仍沿用 1.12.9 的正文。

  - plugin_version: "1.12.13+"
    cli_min: "1.0.0"
    cli_recommended: "1.22.14"
    notes: >-
      Aether #496: aether-setup 的配置说明与 CLI 一致 (项目级整份替代全局、不读 .env, #491), 写入配置改用 yq -i 只改 cluster.*;
      不依赖新的 CLI 版本。aether-dev 未过 AB, 仍沿用 1.12.9 的正文。

  - plugin_version: "1.12.14+"
    cli_min: "1.0.0"
    cli_recommended: "1.22.14"
    notes: >-
      Aether #496: aether-dev 的 deploy 改为渲染 → `nomad job validate` → `nomad job plan` → `nomad job run -check-index`
      (都是 nomad CLI 的功能, 与 aether CLI 版本无关), 配置读取与 CLI 同一规则 (#491) 并 export NOMAD_ADDR;
      aether-setup 订正默认值说法、写明 yq 要用 mikefarah v4。均不依赖新的 CLI 版本, cli_min 保持 1.0.0 不上抬。

  - plugin_version: "1.12.15+"
    cli_min: "1.0.0"
    cli_recommended: "1.22.14"
    notes: >-
      Aether #503: aether-setup 的集群发现写明字段取自哪个接口 (详情 /v1/node/<id> 没有 Address; 可用 driver 只算
      Detected 且 Healthy 的)。只涉及 Nomad HTTP API, 不依赖新的 CLI 版本, cli_min 保持 1.0.0 不上抬。

  - plugin_version: "1.12.16+"
    cli_min: "1.0.0"
    cli_recommended: "1.23.1"
    notes: >-
      Aether #508: aether-deploy / aether-rollback 改用 CLI 1.23 的 dry-run plan (`.data.plan`)、`--check-index` 与按版本判定的
      健康检查 (`health_check.job_version` / `deployment_status`、`DEPLOYMENT_*` 错误码), 两个 skill 的 min_version 为 1.23.0 ——
      更早的 CLI 不认 `--check-index` (unknown flag, 不会提交), dry-run 也没有 `.data.plan` (skill 写明这时先升级)。
      其余 skill 不依赖, cli_min 保持 1.0.0 不上抬。

# 依赖 CLI 的 Skills
dependent_skills:
  - name: aether-doctor
    cli_required: false
    role: "CLI 安装和检测的提供者"

  - name: aether-init
    cli_required: true
    min_version: "0.9.0"

  - name: aether-volume
    cli_required: true
    min_version: "0.9.0"

  - name: aether-deploy
    cli_required: true
    min_version: "1.23.0"

  - name: aether-dev
    cli_required: true
    min_version: "0.9.0"

  - name: aether-rollback
    cli_required: true
    min_version: "1.23.0"

  - name: aether-status
    cli_required: false
    note: "通过 Nomad/Consul API 直接查询"

  - name: aether-deploy-watch
    cli_required: false
    note: "调用 aether-status，不直接使用 CLI"

  - name: aether-setup
    cli_required: false
    note: "只写配置文件"
